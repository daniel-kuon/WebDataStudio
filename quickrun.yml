# yaml-language-server: $schema=https://fgilde.github.io/QuickRun/quickrun.schema.json
name: WebDataStudio
description: "Server plus studio UI, the way the README develops it: the API on 5000 and the Vite front end on 5173, which proxies /api to it. A plain dotnet run builds Debug, and the SPA is only built in Release, so it would serve an empty 404."

requires:
  - tool: dotnet
    version: ">=10.0"
    install: https://dotnet.microsoft.com/download
  - tool: node
    version: ">=20.0"
    install: https://nodejs.org

inputs:
  # The switch between "something to click on" and a blank studio. The choice is the DEMO
  # connection itself: with no file name the composed Data Source below points at a folder, which
  # no engine claims, so the connection is skipped — and the seed only fills connections that
  # exist. "Empty" therefore means no demo connection and nothing seeded, not a hidden default.
  - id: demoData
    label: Demo data
    type: select
    description: >-
      Seeded starts with the dataset the documentation screenshots show — people, orders, items
      and places on a SQLite connection called DEMO. Empty starts with no connection at all; add
      your own on the connections page.
    default: demo.db
    options:
      - { value: demo.db, label: seeded with the demo data }
      - { value: "", label: empty — add connections yourself }
    persist: true

env:
  # Program.cs defaults to /data/webdatastudio.db, which is C:\data\... on Windows.
  DB_PATH: ${workspace}/wds.db
  # Absolute on purpose: dotnet run gives the server the project directory as its working
  # directory, so a relative path here would quietly point somewhere else.
  WDS_CONN_DEMO: Data Source=${workspace}/data/${inputs.demoData}
  # The studio seeds a fresh DEMO on first start (web/scripts/demo-data/DEMO.sql, once per script
  # content). Inert while the demo connection is off: only a connection that exists is seeded.
  WDS_SEED_SQL: ${workspace}/web/scripts/demo-data

setup:
  - run: dotnet restore
  - run: npm ci
    cwd: web
  # Where the demo database lives — /data/ is already ignored by git, and SQLite can only create
  # a file in a folder that exists. "Already exists" is the good case, hence continueOnError.
  - run: mkdir data
    continueOnError: true

tasks:
  - name: api
    run: dotnet run --project src/WebDataStudio.Server --urls http://localhost:5000
    readyWhen: {port: 5000}
  - name: web
    run: npm run dev
    cwd: web
    dependsOn: [api]
    readyWhen: {http: "http://localhost:5173"}
    open: true
